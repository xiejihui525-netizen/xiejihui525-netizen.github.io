<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水豚噜噜 v2 动作预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f7;color:#23312c;font-family:system-ui,sans-serif;letter-spacing:0}
header{max-width:1100px;margin:auto;padding:32px 24px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.title h1{margin:0;font-size:25px}.title p{margin:6px 0 0;color:#60706a;font-size:14px}.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}label{display:flex;align-items:center;gap:8px;font-size:14px}input{accent-color:#218467;width:18px;height:18px}
.download{display:inline-flex;align-items:center;padding:9px 13px;border-radius:6px;background:#218467;color:#fff;text-decoration:none;font-size:14px}.download:hover{background:#176b53}
main{max-width:1100px;margin:auto;padding:0 24px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
figure{margin:0;background:#fff;border:1px solid #d8dfe0;border-radius:8px;overflow:hidden}figcaption{padding:14px 16px;border-top:1px solid #e5e9e9;font-size:14px}
.stage{height:224px;display:grid;place-items:center;background-color:#fff;background-image:linear-gradient(45deg,#eef2f0 25%,transparent 25%),linear-gradient(-45deg,#eef2f0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eef2f0 75%),linear-gradient(-45deg,transparent 75%,#eef2f0 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
.pet{width:192px;height:208px;background-image:url('spritesheet.webp');background-size:1536px 2288px;background-repeat:no-repeat}
@media(max-width:300px){header,main{padding-left:8px;padding-right:8px}main{grid-template-columns:1fr}}
</style>
<header><div class="title"><h1>水豚噜噜 v2</h1><p>Codex 桌宠完整动作包 · 11 行图集 · 73 个动画姿态</p></div><div class="actions"><label><input id="play" type="checkbox" checked>播放动作</label><a class="download" href="./lulu-capybara-v2.zip" download>下载安装包</a></div></header>
<main id="gallery"></main>
<script>
const states=[
['慢眨眼',0,[280,110,110,140,140,320]],
['向右走',1,[120,120,120,120,120,120,120,220]],
['向左走',2,[120,120,120,120,120,120,120,220]],
['打招呼',3,[140,140,140,280]],
['小跳一下',4,[140,140,140,140,280]],
['有点委屈',5,[140,140,140,140,140,140,140,240]],
['等你回应',6,[150,150,150,150,150,260]],
['认真思考',7,[120,120,120,120,120,220]],
['看看结果',8,[150,150,150,150,150,280]],
['四处看看',9,Array(16).fill(180)]
];
const gallery=document.getElementById('gallery');
const pets=states.map(([name,row,durations])=>{
  const figure=document.createElement('figure');
  const stage=document.createElement('div');stage.className='stage';
  const pet=document.createElement('div');pet.className='pet';pet.setAttribute('role','img');pet.setAttribute('aria-label',name+'的噜噜');
  const caption=document.createElement('figcaption');caption.textContent=name;
  stage.append(pet);figure.append(stage,caption);gallery.append(figure);
  return {pet,row,durations,total:durations.reduce((a,b)=>a+b,0)};
});
const play=document.getElementById('play');
if(matchMedia('(prefers-reduced-motion: reduce)').matches)play.checked=false;
let previous=performance.now(),elapsed=0;
function tick(now){
  if(play.checked)elapsed+=Math.min(now-previous,100);previous=now;
  for(const {pet,row,durations,total} of pets){
    let time=elapsed%total,index=0;
    while(index<durations.length-1&&time>=durations[index])time-=durations[index++];
    const actualRow=row===9?9+Math.floor(index/8):row;
    pet.style.backgroundPosition=`${-(index%8)*192}px ${-actualRow*208}px`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</html>
